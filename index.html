<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cursed Battle</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            background:
                radial-gradient(circle at center, #3a0000 0%, #120000 35%, #080808 75%);
        }

        .content {
            max-width: 800px;
        }

        .small-title {
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(60px, 12vw, 130px);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;
            color: #bbb;
            margin-bottom: 45px;
        }

        .button {
            display: inline-block;
            padding: 16px 35px;
            border: 1px solid #ffffff;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="content">

            <div class="small-title">
                RPG de Jujutsu Kaisen
            </div>

            <h1>
                Cursed Battle
            </h1>

            <p class="subtitle">
                Entre no mundo das maldições, feiticeiros e técnicas Jujutsu.
            </p>

            <a href="#" class="button">
                Explorar
            </a>

        </div>
    </section>

</body>
</html>
